[project]
name = "estimycar"
version = "0.9.0"
description = "Estimateur de prix de véhicule basé sur des annonces scrapées depuis le site lacentrale.fr"
readme = "README.md"
authors = [
    {name = "Hassan TILKI"},
    {name = "Aybuke BICAT"},
    {name = "Richard DALLY"},
]
requires-python = ">=3.11"
dependencies = [
    "bs4",
    "dataclasses",
    "duckdb",
    "joblib",
    "numpy",
    "plotly",
    "polars",
    "requests",
    "scikit-learn",
    "serde",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
